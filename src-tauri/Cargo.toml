[package]
name = "luna-mic"
version = "0.7.0"
description = "A small local microphone processing utility"
edition = "2021"
license = "MIT"
default-run = "luna-mic"

[lib]
name = "luna_mic_core"
path = "src/lib.rs"

[features]
default = ["noise-suppression", "speex", "webrtc", "deepfilter"]
noise-suppression = ["dep:nnnoiseless"]
speex = []
webrtc = ["dep:sonora"]
deepfilter = ["dep:deep_filter", "dep:ndarray"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
ringbuf = "0.4.8"
triple_buffer = "9"
# 0.5.1 owns its FFT scratch/plans; 0.5.2 switched to easyfft's dynamic cache.
nnnoiseless = { version = "=0.5.1", default-features = false, optional = true }
sonora = { version = "=0.2.0", optional = true }
deep_filter = { path = "../vendor/deepfilternet/libDF", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.54", features = ["implement", "Win32_Devices_Properties", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
